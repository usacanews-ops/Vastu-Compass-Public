name: Build Android App

on:
  workflow_dispatch: # This adds the "Run workflow" button in GitHub Actions
jobs:
  build:
    runs-on: ubuntu-latest
    
    # Required permission for GitHub Actions to create a Release
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Pinned to 8.5 to fix the DefaultArtifactPublicationSet crash
          gradle-version: '8.5'

      - name: Build Release APK
        # Using global 'gradle' bypasses the missing ./gradlew file error
        run: gradle :composeApp:assembleRelease

      - name: Bypass Quota - Upload as GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-build-${{ github.run_number }}
          name: App Release Build ${{ github.run_number }}
          files: composeApp/build/outputs/apk/release/*.apk
          prerelease: true
