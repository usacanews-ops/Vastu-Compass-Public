name: Generate Keystore
on: workflow_dispatch

jobs:
  gen-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and Print Base64 & SHA-1
        run: |
          keytool -genkeypair -v -keystore release.jks -alias vastucompass -keyalg RSA -keysize 2048 -validity 10000 -storepass VastuPass123 -keypass VastuPass123 -dname "CN=IWS, O=IWS, C=IN"
          echo "=== YOUR SHA-1 (Copy to Google Cloud Console) ==="
          keytool -list -v -keystore release.jks -alias vastucompass -storepass VastuPass123 | grep "SHA1:"
          echo "=== YOUR BASE64 KEYSTORE (Copy to GitHub Secret) ==="
          base64 -w 0 release.jks
          echo ""
