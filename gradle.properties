
# Enable AndroidX (Required for Compose)
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin settings
kotlin.code.style=official
# Enable Gradle Build Cache (reuses compiled classes across builds)
org.gradle.caching=true

# Compile modules in parallel
org.gradle.parallel=true

# Enable incremental Kotlin compilation
kotlin.incremental=true

# Allocate enough memory so Gradle doesn't hit GC bottlenecks
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Use configuration cache if supported
org.gradle.configuration-cache=false
